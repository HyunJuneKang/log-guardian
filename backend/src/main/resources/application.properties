spring.application.name=backend

# Supports launching from the repository root or backend directory.
# IntelliJ Run Configuration environment variables override these local files.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
# Local demo development: synchronize entity mappings with the database.
spring.jpa.hibernate.ddl-auto=update

server.port=8080
app.analysis-date=2026-10-08
spring.jackson.time-zone=Asia/Seoul
spring.jackson.default-property-inclusion=always
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
